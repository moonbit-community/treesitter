[package]
name = "tree-sitter-generate"
version = "0.28.0"
edition = "2024"

[lib]
path = "src/generate.rs"

[[bin]]
name = "dump"
path = "dump/main.rs"

[features]
default = [ "load" ]
load = [ "dep:semver" ]

[dependencies]
bitflags = "2.11.1"
dunce = "1.0.5"
hashbrown = { default-features = false, version = "0.17.1" }
indexmap = "2.13.0"
log = { features = [ "std" ], version = "0.4.30" }
regex-syntax = "0.8.11"
rustc-hash = "2.1.1"
semver = { features = [ "serde" ], version = "1.0.27", optional = true }
serde = { features = [ "derive" ], version = "1.0.228" }
serde_json = { features = [ "preserve_order" ], version = "1.0.150" }
thiserror = "2.0.18"
topological-sort = "0.2.2"

[profile.release]
debug = false
