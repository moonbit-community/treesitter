name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install MoonBit
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - name: Check portable library and native CLI
        run: sh tools/check.sh
      - name: Check generated interfaces
        run: |
          moon info
          moon info --target native
          git diff --exit-code -- '*.mbti'
  oracle:
    # Differential test against the pinned upstream Tree-sitter: generator
    # output, runtime trees (all modes) and query results must be identical.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Install MoonBit
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            .repos/ts-pinned/target
            ~/.cargo/registry
          key: oracle-${{ runner.os }}-4a412a01a0147d0f50bf7e749572fa632d1ab203
      - name: Set up the pinned upstream and reference outputs
        run: sh tools/oracle/oracle_setup.sh
      - name: Differential oracle
        run: sh tools/oracle/oracle.sh
      - name: CLI differential
        run: sh tools/oracle/diff_cli.sh
      - name: Grammar modules match upstream's tables
        run: |
          moon build --target native --release tools/grammar_modules
          python3 tools/oracle/compare_modules.py
      - name: Grammar modules are up to date
        run: |
          sh tools/grammars/update.sh
          git diff --exit-code
      - name: Ported upstream test suites (with fixtures)
        run: moon test --target native
