name: Publish to Mooncakes
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-mooncakes
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install MoonBit
        run: |
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - name: Validate release
        run: sh tools/check.sh
      - name: Publish
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN || secrets.MOONCAKES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOONCAKES_CREDENTIALS" || { echo 'Mooncakes community credentials are required'; exit 1; }
          umask 077
          mkdir -p "$HOME/.moon"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s' "$MOONCAKES_CREDENTIALS" > "$HOME/.moon/credentials.json"
          # This moon version exits non-zero even when the server accepts the
          # dry run (202 "Dry run completed successfully").
          moon publish --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.log" || true
          grep -q 'Dry run completed successfully' "$RUNNER_TEMP/dry-run.log"
          moon publish
      - name: Verify registry installation and mbtx execution
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)
          python3 tools/check_registry.py "$version"
